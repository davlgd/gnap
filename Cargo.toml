[workspace]
resolver = "2"
members = ["crates/gnap-registry", "crates/gnap-types", "crates/gnap-crypto", "crates/gnap-core", "crates/gnap-client", "crates/gnap-as", "crates/gnap-biscuit", "crates/gnap-subject", "crates/gnap-net"]

# Investigation spikes are kept out of the workspace so their dependencies do
# not constrain how it resolves. These directories are not part of the
# repository; Cargo ignores entries that are not present.
exclude = ["spikes/httpsig-vectors", "spikes/serde-polymorphism"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/davlgd/gnap"
homepage = "https://github.com/davlgd/gnap"
readme = "README.md"

[workspace.dependencies]
gnap-net = { path = "crates/gnap-net", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gnap-registry = { path = "crates/gnap-registry", version = "0.1.0" }
gnap-types = { path = "crates/gnap-types", version = "0.1.0" }
gnap-core = { path = "crates/gnap-core", version = "0.1.0" }
gnap-subject = { path = "crates/gnap-subject", version = "0.1.0" }
gnap-crypto = { path = "crates/gnap-crypto", version = "0.1.0" }
gnap-client = { path = "crates/gnap-client", version = "0.1.0" }
sha2 = "0.10"
sha3 = "0.10"
base64 = "0.22"
subtle = "2.6"
httpsig = "0.0.26"
sfv = "0.15"
rsa = { version = "0.9", features = ["sha2"] }
getrandom = "0.2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# A reference implementation is read more than it is written: these carry real
# information for someone arriving at the code.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# GNAP field names come from the RFC; renaming them for style would be worse.
module_name_repetitions = "allow"
# The RFC's own prose is quoted throughout; wrapping every term in backticks
# would make it unreadable.
doc_markdown = "allow"
