[package]
name = "gnap-crypto"
version = "0.1.0"
description = "Key proofing and interaction hashing for GNAP (RFC 9635)"
keywords = ["gnap", "rfc9635", "rfc9421", "http-signatures", "authorization"]
categories = ["authentication", "cryptography"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/gnap-crypto"

[dependencies]
# The URI and access-token grammars that the JOSE proofs check.
gnap-types = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
httpsig = { workspace = true }
sfv = { workspace = true }
rsa = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# The strict-verification test builds a signature from the curve's scalars.
curve25519-dalek = { workspace = true }

[lints]
workspace = true
