name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older runs. Each run on main gets its
# own group, so none is cancelled or dropped from the queue by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # The quick checks run first, and the jobs below start only once they pass: a
  # formatting, documentation, or commit problem fails the run before the costly jobs
  quick:
    name: Format, documentation and commit conventions
    runs-on: ubuntu-latest
    steps:
      # commitlint reads the commit objects of the pull request, so the history is
      # fetched, but only the blobs of the checked-out tree are downloaded
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Format
        # The three applications are separate workspaces, which --all doesn't reach
        run: |
          cargo fmt --all --check
          for app in delegation-demo conformance-web biscuit-files; do
            cargo fmt --manifest-path "apps/$app/Cargo.toml" --check
          done

      - name: Install the tools pinned in mise.toml
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Lint the Markdown and check internal links
        run: mise run lint:docs

      - name: Check the commit subjects
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose

  check:
    name: Test, lint and document
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint
        # The workspace turns on clippy's pedantic and nursery groups; RUSTFLAGS
        # makes any warning fail the build.
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace

      - name: Document
        # Every public item is documented, and the lint that enforces it is set
        # to deny; this catches a broken intra-doc link too.
        run: cargo doc --workspace --no-deps

      - name: Run the examples
        # They are documentation as much as code, so they must keep working.
        run: |
          cargo run -p gnap-as --example flow
          cargo test -p gnap-as --example jwk_client --locked
          cargo run -p gnap-as --example jwk_client --locked
          cargo run -p gnap-biscuit --example file_access --locked
          cargo run -p gnap-crypto --example sign
          echo '{"client":"example-client"}' | cargo run -p gnap-types --example lint -- request

  claims:
    name: What the code claims about the RFCs
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Published receipts verify source hashes against their earlier commit.
          fetch-depth: 0
      - name: Install Python for the verification tools
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Quotations are literal
        # The code quotes the RFCs to justify what it does. A drifted quotation
        # lends the authority of the normative text to a sentence nobody wrote,
        # so this checks selected quotations in crate/app source trees against
        # the RFCs, downloading missing source texts. Test the selection too.
        run: |
          python3 -B -m unittest discover -s tools/tests -v
          python3 tools/check_quotes.py
      - name: The published walkthrough matches the example
        # Keep the narrated guide checked against a locked execution; support
        # claims live in the public matrix, not an ignored local perimeter.
        run: python3 tools/check_getting_started.py
      - name: Crate documentation and embedded assets are self-contained
        run: python3 -B tools/check_package_assets.py
      - name: Normative source inventory and evidence accounting
        run: |
          python3 -B tools/conformance_ledger.py check
          python3 -B tools/conformance_ledger.py run-tests
          # Offline synthetic oracle tests, never an opt-in live collection.
          python3 -B tools/conformance_ledger.py discovery-tests

  msrv:
    name: Minimum supported Rust version
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        # Verify the minimum version against the committed dependency graph.
        run: cargo +1.95.0 build --workspace --locked

  ecosystem:
    name: Real application consumers
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Node.js version pinned in mise.toml
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node
      - name: Check application interface behavior
        run: node --test apps/ui/tests/*.test.mjs apps/conformance-web/tests/ui/*.test.mjs apps/delegation-demo/tests/ui/*.test.mjs
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/delegation-demo -> target
            apps/conformance-web -> target
            apps/biscuit-files -> target
      - name: Check and build standalone consumers
        run: |
          for app in delegation-demo conformance-web biscuit-files; do
            cargo clippy --manifest-path "apps/$app/Cargo.toml" --all-targets --locked -- -D warnings
            cargo test --manifest-path "apps/$app/Cargo.toml" --locked
            cargo build --manifest-path "apps/$app/Cargo.toml" --locked
          done
      - name: Exercise actual HTTP applications
        shell: bash
        run: |
          PORT=18081 APP_ORIGIN=http://127.0.0.1:18081 apps/delegation-demo/target/debug/gnap-delegation-demo > "$RUNNER_TEMP/gnap-demo.log" 2>&1 &
          demo_pid=$!
          PORT=18082 apps/conformance-web/target/debug/gnap-conformance-web > "$RUNNER_TEMP/gnap-workbench.log" 2>&1 &
          workbench_pid=$!
          trap 'kill "$demo_pid" "$workbench_pid" 2>/dev/null || true' EXIT
          python3 tools/smoke_ecosystem.py --demo http://127.0.0.1:18081 --demo-alias http://localhost:18081 --workbench http://127.0.0.1:18082
          # Exercise the actual HTTP/2 listener, not just synthetic router requests.
          test "$(curl --http2-prior-knowledge --silent --show-error --noproxy '*' --max-time 10 --output /dev/null --write-out '%{http_version} %{http_code}' http://127.0.0.1:18081/api/status)" = '2 200'
          test "$(curl --http2-prior-knowledge --silent --show-error --noproxy '*' --max-time 10 --output /dev/null --write-out '%{http_version} %{http_code}' http://localhost:18081/api/status)" = '2 421'
          test "$(curl --http2-prior-knowledge --silent --show-error --noproxy '*' --max-time 10 --output /dev/null --write-out '%{http_version} %{http_code}' http://localhost:18081/)" = '2 307'

      - name: Exercise authenticated workbench approval and denial
        shell: bash
        timeout-minutes: 8
        run: |
          demo_pid=''
          PORT=18084 GNAP_WORKBENCH_ORIGIN=http://127.0.0.1:18084 \
            GNAP_LIFECYCLE_TARGETS='[{"name":"CI document service","grant":"http://127.0.0.1:18083/gnap","continuation":"http://127.0.0.1:18083/continue","interaction":"http://127.0.0.1:18083/interact/","management":"http://127.0.0.1:18083/token/","resource":"http://127.0.0.1:18083/resource/folder"}]' \
            apps/conformance-web/target/debug/gnap-conformance-web > "$RUNNER_TEMP/gnap-lifecycle-workbench.log" 2>&1 &
          workbench_pid=$!
          trap 'kill "$workbench_pid" 2>/dev/null || true; if [[ -n "$demo_pid" ]]; then kill "$demo_pid" 2>/dev/null || true; fi' EXIT
          wait_for_endpoint() {
            local endpoint="$1" service_pid="$2"
            for attempt in {1..60}; do
              kill -0 "$service_pid" 2>/dev/null || return 1
              if curl --fail --silent --noproxy '*' --max-time 1 --output /dev/null "$endpoint"; then return 0; fi
              sleep 1
            done
            return 1
          }
          wait_for_endpoint http://127.0.0.1:18084/api/lifecycle/key "$workbench_pid"
          # Only the public JWK and fixed callback cross this process boundary.
          lifecycle_public_clients=$(python3 -B tools/smoke_lifecycle.py --workbench http://127.0.0.1:18084 --registration-only)
          PORT=18083 APP_ORIGIN=http://127.0.0.1:18083 GNAP_EXTERNAL_CLIENTS="$lifecycle_public_clients" \
            apps/delegation-demo/target/debug/gnap-delegation-demo > "$RUNNER_TEMP/gnap-lifecycle-demo.log" 2>&1 &
          demo_pid=$!
          wait_for_endpoint http://127.0.0.1:18083/api/status "$demo_pid"
          python3 -B tools/smoke_lifecycle.py --demo http://127.0.0.1:18083 --workbench http://127.0.0.1:18084 --choice allow
          # Keep the public admission policy intact; there is no CI bypass.
          sleep 60
          python3 -B tools/smoke_lifecycle.py --demo http://127.0.0.1:18083 --workbench http://127.0.0.1:18084 --choice deny

      - name: Exercise the public Biscuit acceptance driver locally
        shell: bash
        timeout-minutes: 6
        run: |
          biscuit_test_directory=$(mktemp -d)
          export KEY_SOURCE=directory KEY_DIRECTORY="$biscuit_test_directory/keys"
          export AS_ORIGIN=http://127.0.0.1:18085 RS_ORIGIN=http://127.0.0.1:18086 CLIENT_ORIGIN=http://127.0.0.1:18087
          apps/biscuit-files/target/debug/as --init-config "$KEY_DIRECTORY"
          as_pid='' rs_pid='' client_pid=''
          trap 'for service_pid in "$as_pid" "$rs_pid" "$client_pid"; do if [[ -n "$service_pid" ]]; then kill "$service_pid" 2>/dev/null || true; fi; done' EXIT
          PORT=18085 apps/biscuit-files/target/debug/as > "$RUNNER_TEMP/biscuit-as.log" 2>&1 &
          as_pid=$!
          PORT=18086 apps/biscuit-files/target/debug/rs > "$RUNNER_TEMP/biscuit-rs.log" 2>&1 &
          rs_pid=$!
          PORT=18087 apps/biscuit-files/target/debug/client > "$RUNNER_TEMP/biscuit-client.log" 2>&1 &
          client_pid=$!
          wait_for_role() {
            local endpoint="$1" service_pid="$2"
            for attempt in {1..45}; do
              kill -0 "$service_pid" 2>/dev/null || return 1
              if curl --fail --silent --noproxy '*' --max-time 1 --output /dev/null "$endpoint/health"; then return 0; fi
              sleep 1
            done
            return 1
          }
          wait_for_role "$AS_ORIGIN" "$as_pid"
          wait_for_role "$RS_ORIGIN" "$rs_pid"
          wait_for_role "$CLIENT_ORIGIN" "$client_pid"
          python3 -B tools/smoke_biscuit.py --as "$AS_ORIGIN" --rs "$RS_ORIGIN" --client "$CLIENT_ORIGIN" --consent

  registries:
    name: Registry generation and upstream drift
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the registry formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Reproduce the vendored registry artifact
        run: |
          python3 tools/generate_registry.py
          git diff --exit-code -- crates/gnap-registry/src/generated.rs
      - name: Fetch the current IANA registries
        id: fetch
        # Network-bound: an unreachable IANA is reported, it doesn't block a merge
        continue-on-error: true
        timeout-minutes: 5
        run: python3 tools/fetch_registries.py
      - name: Regenerate from the fetched registries
        # Once the data is fetched, a generator failure on it is a real failure
        if: steps.fetch.outcome == 'success'
        run: python3 tools/generate_registry.py
      - name: Report any drift
        # Not a failure: IANA moving is news, not a bug. The diff says what
        # changed and the generated file is ready to commit.
        run: |
          if ! git diff --quiet; then
            echo "::warning::The IANA registries have changed since they were vendored."
            git --no-pager diff --stat
          fi
