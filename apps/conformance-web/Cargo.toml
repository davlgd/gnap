[package]
name = "gnap-conformance-web"
version = "0.1.0"
edition = "2024"
publish = false

# Independently deployable consumer of the SDK, not a seventh SDK crate.
[workspace]

[dependencies]
# The checks, the bounded transport and the lifecycle scenario.
gnap-conformance = { path = "../../crates/gnap-conformance" }
gnap-net = { path = "../../crates/gnap-net" }
gnap-client = { path = "../../crates/gnap-client" }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
gnap-types = { path = "../../crates/gnap-types" }
gnap-crypto = { path = "../../crates/gnap-crypto" }
gnap-registry = { path = "../../crates/gnap-registry" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# The lifecycle scenario runs against a real authorization server, in memory.
gnap-as = { path = "../../crates/gnap-as" }

[lints.rust]
unsafe_code = "forbid"
