[package]
name = "gnap-conformance-web"
version = "0.1.0"
edition = "2021"
publish = false

# Independently deployable consumer of the SDK, not a seventh SDK crate.
[workspace]

[dependencies]
axum = "=0.7.9"
tokio = { version = "=1.51.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
gnap-types = { path = "../../crates/gnap-types" }
gnap-crypto = { path = "../../crates/gnap-crypto" }
gnap-registry = { path = "../../crates/gnap-registry" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
