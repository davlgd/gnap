[package]
name = "gnap-biscuit-files"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[workspace]

[dependencies]
axum = { version = "0.8.9", features = ["http2"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
biscuit-auth = { version = "=6.0.0", default-features = false, features = ["regex-full", "datalog-macro"] }
gnap-as = { path = "../../crates/gnap-as" }
gnap-client = { path = "../../crates/gnap-client" }
gnap-crypto = { path = "../../crates/gnap-crypto" }
gnap-types = { path = "../../crates/gnap-types" }
gnap-registry = { path = "../../crates/gnap-registry" }
gnap-biscuit = { path = "../../crates/gnap-biscuit" }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
